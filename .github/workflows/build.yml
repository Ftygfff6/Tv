name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' | while read -r f; do
            if unzip -l "$f" | grep -q 'CaptureService.java'; then echo "$f"; fi
          done | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No project zip found. Zip files in repo:"
            find . -maxdepth 3 -iname '*.zip'
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o "$ZIP" -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gtar-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
